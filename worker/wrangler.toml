name = "ai-roundtable"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# 무료 플랜에서도 동작하도록 Durable Object·유료 기능은 쓰지 않는다.
# (선택) 일일 사용량을 인스턴스 재시작 후에도 유지하려면 KV 네임스페이스를 만들고 아래 주석을 푼다.
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "<KV 네임스페이스 ID>"

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
GEMINI_MODEL = "gemini-3.5-flash-lite"
MODERATOR_MODEL = "gemini-3.5-flash-lite"
# 무료 한도(공식·실측)보다 낮게 잡아 두고, 닿으면 앱이 스스로 멈춘다. 추가 과금 전환은 없다.
GROQ_DAILY_CAP = "300"      # Groq 무료 RPD 1,000 / TPD 200K 안에서 보수적으로
GEMINI_DAILY_CAP = "300"    # Gemini 3.5 Flash-Lite 무료 RPD 500(실측) 안에서 보수적으로
# 이 키워드가 들어간 요청은 외부 API로 보내지 않는다(쉼표 구분, 기본값에 추가).
BLOCK_KEYWORDS = ""

# 비밀키는 절대 여기 적지 않는다. 배포 후 아래 명령으로만 넣는다.
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APP_ACCESS_TOKEN
